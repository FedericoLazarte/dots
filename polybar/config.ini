; includes al principio, fuera de cualquier sección
include-file = ~/.config/polybar/system.ini
include-file = ~/.config/polybar/modules.ini

[global/wm]
margin-bottom = 0
margin-top = 0

[color]
bg = #1A1A1A
fg = #F0F0F0
bc = #3A3A3A
white = #FFFFFF
black = #000000
red = #C0392B
blue = #4A4A4E
green = #6E6E72
yellow = #8A8A8E
grey = #5A5A5E

[bar/main]
monitor = ${env:MONITOR:}
bottom = true
fixed-center = true
width = 63%
height = 32
offset-x = 1%
offset-y = 5
background = ${color.bg}
foreground = ${color.fg}
radius = 18.0
line-size = 1
line-color = ${color.grey}
border-size = 1
border-color = ${color.bc}
padding = 6
module-margin-left = 3
module-margin-right = 3
font-0 = "IosevkaTerm Nerd Font Heavy:style=Bold:size=9;2"
font-1 = "IosevkaTerm Nerd Font:size=10;2"
font-2 = "Material Design Icons:size=13;3"
modules-left = sep2 term sep2 web sep2 files sep2 cpu sep2 memory sep2 pulseaudio sep2 battery sep2 network sep1
modules-center = sep2 mpd_control sep2 mpd sep1
modules-right = 
enable-ipc = true
cursor-click = pointer
override-redirect = false
wm-restack = generic

[bar/workspace]
monitor = ${env:MONITOR:}
bottom = true
fixed-center = true
width = 22%
height = 32
offset-x = 77%
offset-y = 5
background = ${color.bg}
foreground = ${color.fg}
radius = 18.0
line-size = 1
line-color = ${color.grey}
border-size = 1
border-color = ${color.bc}
padding = 6
module-margin-left = 3
module-margin-right = 3
font-0 = "Material Design Icons:size=13;3"
modules-left =
modules-center = xworkspaces
modules-right =
enable-ipc = true
cursor-click = pointer
override-redirect = false
wm-restack = generic

[settings]
screenchange-reload = false
compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over
pseudo-transparency = false
