[global/wm]
margin-bottom = 0
margin-top = 0

include-file = ~/.config/polybar/system.ini
include-file = ~/.config/polybar/modules.ini

[color]
bg = #ffffff
fg = #000000
bc = #000000
white = #000000
black = #2A2A2C
red = #C0392B
blue = #6E6E72
green = #8A8A8E
yellow = #A0A0A4
grey = #7A7A7E
gray = #7A7A7E

[bar/left]
monitor = ${env:MONITOR:}
bottom = false
fixed-center = true
width = 38%
height = 37
offset-x = 1%
offset-y = 5
background = ${color.bg}
foreground = ${color.fg}
radius = 12.0
line-size = 2
line-color = ${color.blue}
border-size = 2
border-color = ${color.bc}
padding = 2
module-margin-left = 1
module-margin-right = 1
font-0 = "IosevkaTerm Nerd Font:size=9;2"
font-1 = "JetBrainsMono Nerd Font:style=Bold:size=9;2"
font-2 = "Material Design Icons:size=13;3"
font-3 = "IosevkaTerm Nerd Font:size=10;2"
modules-left = term sep2 web sep2 files
modules-center = cpu sep2 memory
modules-right =
enable-ipc = true
cursor-click = pointer
override-redirect = false
wm-restack = generic

[bar/right]
monitor = ${env:MONITOR:}
bottom = false
fixed-center = true
width = 38%
height = 37
offset-x = 61%
offset-y = 5
background = ${color.bg}
foreground = ${color.fg}
radius = 12.0
line-size = 2
line-color = ${color.blue}
border-size = 2
border-color = ${color.bc}
padding = 2
module-margin-left = 1
module-margin-right = 1
font-0 = "JetBrainsMono Nerd Font:style=Bold:size=9;2"
font-1 = "IosevkaTerm Nerd Font:size=10;2"
font-2 = "Material Design Icons:size=13;3"
modules-left = mpd_control sep2 mpd sep1
modules-center = battery network sep2 pulseaudio
modules-right = sep2 date
enable-ipc = true
cursor-click = pointer
override-redirect = false
wm-restack = generic

[bar/workspace]
monitor = ${env:MONITOR:}
bottom = false
fixed-center = true
width = 20%
height = 37
offset-x = 40%
offset-y = 5
background = ${color.bg}
foreground = ${color.fg}
radius = 12.0
line-size = 2
line-color = ${color.blue}
border-size = 2
border-color = ${color.bc}
padding = 1
module-margin-left = 1
module-margin-right = 1
font-0 = "Material Design Icons:size=13;3"
modules-left =
modules-center = xworkspaces
modules-right =
enable-ipc = true
cursor-click = pointer
override-redirect = false
wm-restack = generic

[settings]
screenchange-reload = false
compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over
pseudo-transparency = false
