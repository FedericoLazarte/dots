[module/date]
type = internal/date
interval = 1.0
time = %I:%M %P
label = %time%
format = <label>

[module/term]
type = custom/text
format = "%{T2}󰆍%{T-}"
format-foreground = ${color.black}
click-left = xfce4-terminal &

[module/web]
type = custom/text
format = "%{T2}󰈹%{T-}"
format-foreground = ${color.white}
click-left = firefox &

[module/files]
type = custom/text
format = "%{T2}󰉋%{T-}"
format-foreground = ${color.white}
click-left = thunar &

[module/network]
type = internal/network
interface = ${system.sys_network_interface}
interval = 1.0
accumulate-stats = true
unknown-as-up = true
format-connected = "%{A1:sh -c 'nmcli device wifi rescan; xfce4-terminal -e nmtui' &:}󰖩%{A} <label-connected>"
;format-connected = "󰖩 <label-connected>"
format-connected-foreground = ${color.white}
format-disconnected = "󰖪 <label-disconnected>"
format-disconnected-foreground = ${color.gray}
label-connected = ""
label-disconnected = ""
click-left = /usr/bin/nm-connection-editor

[module/battery]
type = internal/battery
full-at = 99
battery = ${system.sys_battery}
adapter = ${system.sys_adapter}
poll-interval = 2
format-charging = "󰂄 <label-charging>"
label-charging = "%percentage%%"
format-discharging = "󰁹 <label-discharging>"
label-discharging = "%percentage%%"
format-full = "󰁹 <label-full>"
label-full = "%percentage%%"

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true
interval = 5
format-volume = "󰕾 <label-volume>"
label-volume = "%percentage%"
label-volume-foreground = ${color.white}
format-muted = "󰖁 <label-muted>"
label-muted = "Muted"
label-muted-foreground = ${color.gray}

[module/title]
type = internal/xwindow
format = <label>
label = "%title%"
label-maxlen = 12
label-empty = "Parrot OS"

[module/xworkspaces]
type = internal/xworkspaces
pin-workspaces = true
enable-click = true
enable-scroll = true
format = <label-state>
format-padding = 0
label-active = "󰮯 "
label-active-foreground = ${color.white}
label-occupied = "󰧟 "
label-occupied-foreground = ${color.white}
label-urgent = "󰧟 "
label-urgent-foreground = ${color.red}
label-empty = "󰧟 "
label-empty-foreground = ${color.fg}

[module/sep]
type = custom/text
format = " | "
format-foreground = ${color.fg}
format-padding = 5pt

[module/sep1]
type = custom/text
format = "   "
format-foreground = ${color.fg}

[module/sep2]
type = custom/text
format = "   "
format-foreground = ${color.fg}

[module/cpu]
type = internal/cpu
interval = 0.5
format = "󰻠 <label>"
format-foreground = ${color.fg}
label = %percentage%%

[module/memory]
type = internal/memory
interval = 2
format = "󰍛 <label>"
format-foreground = ${color.fg}
label = %used%

[module/mpd]
type = internal/mpd
interval = 2
format-online = <label-song>
format-online-foreground = ${color.white}
label-song = "%title%"
label-song-maxlen = 12
label-song-ellipsis = true
label-offline = "Offline"

[module/mpd_control]
type = internal/mpd
interval = 2
format-online = <icon-prev><toggle><icon-next>
format-offline = <label-offline>
format-offline-foreground = ${color.white}
label-offline = "󰝛 no Music"
icon-play = " 󰐊 "
icon-pause = " 󰏤 "
icon-stop = " 󰓛 "
icon-prev = "󰒮"
icon-next = "󰒭"
