set -g mouse on
set -g default-terminal "tmux-256color"

# Prefijo Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- PLUGINS ---
# Solo declaramos batería aquí. Catppuccin se carga manual abajo.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-battery'

# --- CATPPUCCIN (Carga Manual) ---
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Esta línea carga el tema ANTES de que se use en la barra de estado
run '~/.config/tmux/plugins/tmux/catppuccin.tmux'

# --- STATUS BAR ---
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""

set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -agF status-right "#{E:@catppuccin_status_date_time}"

set -g status-position top

# --- SPLITS & POPUPS ---
unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind d split-window -v -c "#{pane_current_path}"

bind-key -n M-g if-shell -F '#{==:#{session_name},scratch}' {
  detach-client
} {
  display-popup -d "#{pane_current_path}" -E "tmux new-session -A -s scratch"
}

# --- VIM & PORTAPAPELES ---
set -g mode-keys vi

if-shell 'uname | grep -q Darwin' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip"'

# --- NUMERACIÓN ---
set -g base-index 1
setw -g pane-base-index 1

# --- TPM (AL FINAL) ---
run '~/.config/tmux/plugins/tpm/tpm'   
